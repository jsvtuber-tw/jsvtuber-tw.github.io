<!DOCTYPE html>
<html lang="zh-TW">
<head>

  <title>圖片方格製作工具 - 大熊寶殿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

  <style>
    /* Hallmark · macrostructure: Tool Workbench · tone: GTARP dark utility · anchor hue: pink */
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;overflow-x:clip;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body)}body{background-image:radial-gradient(circle at 50% 0%,var(--color-accent-soft),transparent 42%)}button,input{font:inherit}button{color:inherit}a{color:inherit}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:68px;padding:var(--space-3) clamp(var(--space-4),4vw,var(--space-10));border-bottom:var(--rule-thin) solid var(--color-rule);background:oklch(16% .012 300/.86);backdrop-filter:blur(14px)}.brand,.back{display:inline-flex;align-items:center;gap:var(--space-2);text-decoration:none;font-weight:700;white-space:nowrap}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:var(--rule-thin) solid var(--color-accent);border-radius:var(--radius-round);color:var(--color-accent);background:var(--color-accent-soft)}.back{padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);color:var(--color-muted);font-size:var(--text-sm);transition:color var(--dur-fast) var(--ease-out),border-color var(--dur-fast) var(--ease-out)}.back:hover{color:var(--color-accent);border-color:var(--color-accent)}.back:focus-visible,.upload-button:focus-visible,.thumb:focus-visible,.format button:focus-visible,.download:focus-visible,.reset:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}.intro{max-width:1180px;margin:auto;padding:var(--space-10) var(--space-4) var(--space-8)}.intro h1{max-width:780px;margin:0 0 var(--space-3);font-family:var(--font-display);font-size:var(--text-display);line-height:1.15;overflow-wrap:anywhere}.intro h1 span{color:var(--color-accent);text-shadow:0 0 20px var(--color-accent-glow)}.intro p{margin:0;color:var(--color-muted);font-size:var(--text-lg);line-height:1.7}.privacy{display:inline-flex;align-items:center;gap:var(--space-2);margin-top:var(--space-4);padding:var(--space-2) var(--space-3);border-radius:var(--radius-round);background:var(--color-accent-soft);color:var(--color-accent);font-size:var(--text-xs);font-weight:700}.workspace{width:min(1380px,calc(100% - 32px));margin:0 auto var(--space-12);display:grid;grid-template-columns:250px minmax(0,1fr) 280px;min-height:610px;border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-lg);background:var(--color-paper-raised);box-shadow:0 22px 70px oklch(5% 0 0/.42);overflow:hidden}.panel{padding:var(--space-5)}.uploads{display:flex;flex-direction:column;border-right:var(--rule-thin) solid var(--color-rule)}.export{border-left:var(--rule-thin) solid var(--color-rule)}.panel-title{display:flex;align-items:center;gap:var(--space-2);margin:0 0 var(--space-4);font-size:var(--text-sm)}.count{padding:2px 8px;border-radius:var(--radius-round);background:var(--color-accent-soft);color:var(--color-accent);font-size:var(--text-xs)}.upload-button{margin-left:auto;display:grid;place-items:center;width:32px;height:32px;border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper-soft);cursor:pointer}.upload-button input,.dropzone input{display:none}.dropzone{min-height:270px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border:2px dashed var(--color-rule);border-radius:var(--radius-md);cursor:pointer;transition:transform var(--dur-base) var(--ease-out),border-color var(--dur-base) var(--ease-out),background var(--dur-base) var(--ease-out)}.dropzone:hover,.dropzone.over{transform:translateY(-2px);border-color:var(--color-accent);background:var(--color-accent-soft)}.drop-icon{display:grid;place-items:center;width:54px;height:54px;margin-bottom:var(--space-4);border-radius:var(--radius-round);background:var(--color-accent-soft);color:var(--color-accent)}.dropzone strong{font-size:var(--text-sm)}.dropzone span,.dropzone small{margin-top:var(--space-2);color:var(--color-muted);font-size:var(--text-xs)}.local{margin:auto 0 0;padding-top:var(--space-5);text-align:center;color:var(--color-faint);font-size:var(--text-xs)}.thumbs{display:flex;flex-direction:column;gap:var(--space-2);max-height:500px;overflow:auto}.thumb{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) 22px;align-items:center;gap:var(--space-2);padding:var(--space-2);border:var(--rule-thin) solid transparent;border-radius:var(--radius-sm);background:transparent;text-align:left;cursor:pointer}.thumb:hover{background:var(--color-paper-soft)}.thumb.active{border-color:var(--color-accent);background:var(--color-accent-soft)}.thumb img{width:48px;height:48px;object-fit:cover;border-radius:var(--radius-sm)}.thumb-copy{min-width:0}.thumb-copy b{display:block;color:var(--color-accent);font-size:var(--text-xs)}.thumb-copy small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-muted)}.remove{font-style:normal;color:var(--color-muted);font-size:var(--text-xl)}.editor{min-width:0;display:flex;flex-direction:column}.editor-head{min-height:64px;padding:var(--space-4) var(--space-6);display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);border-bottom:var(--rule-thin) solid var(--color-rule)}.editor-head h2{margin:0;font-size:var(--text-base)}.editor-head span{color:var(--color-muted);font-size:var(--text-xs)}.canvas-stage{flex:1;min-height:420px;padding:var(--space-8);display:grid;place-items:center;background-color:var(--color-paper);background-image:linear-gradient(45deg,var(--color-paper-soft) 25%,transparent 25%),linear-gradient(-45deg,var(--color-paper-soft) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--color-paper-soft) 75%),linear-gradient(-45deg,transparent 75%,var(--color-paper-soft) 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}.canvas-box,.empty-canvas{width:min(430px,82%);aspect-ratio:1;background:var(--color-paper-raised)}.canvas-box{position:relative;border:2px solid var(--color-accent);box-shadow:0 0 28px var(--color-accent-glow),0 18px 50px oklch(5% 0 0/.5)}canvas{display:block;width:100%;height:100%;cursor:grab;touch-action:none}canvas:active{cursor:grabbing}.empty-canvas{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);border:2px dashed var(--color-rule);color:var(--color-muted)}.empty-canvas i{color:var(--color-accent)}.empty-canvas p{margin:0;font-size:var(--text-xs)}.controls{padding:var(--space-4) var(--space-6);display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:center;gap:var(--space-4);border-top:var(--rule-thin) solid var(--color-rule)}.zoom label,.quality label{display:flex;justify-content:space-between;font-size:var(--text-xs);font-weight:700}.zoom b,.quality b{color:var(--color-accent)}input[type=range]{width:100%;accent-color:var(--color-accent)}.reset{padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper-soft);font-size:var(--text-xs);font-weight:700;cursor:pointer}.reset:hover{border-color:var(--color-accent);color:var(--color-accent)}.export h2{margin:0 0 var(--space-5);font-size:var(--text-base)}.size-card{padding:var(--space-4);display:flex;flex-direction:column;align-items:center;border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-md);background:var(--color-paper)}.size-card small{align-self:flex-start;color:var(--color-muted)}.size-card strong{margin:var(--space-2) 0;font-size:1.8rem}.size-card strong span{color:var(--color-accent)}.size-card>span{color:var(--color-muted);font-size:var(--text-xs)}fieldset{margin:var(--space-6) 0;padding:0;border:0}legend{margin-bottom:var(--space-2);font-size:var(--text-xs);font-weight:700}.format{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:var(--space-1);border-radius:var(--radius-sm);background:var(--color-paper)}.format button{position:relative;height:40px;border:0;border-radius:6px;background:transparent;font-size:var(--text-xs);font-weight:700;cursor:pointer}.format button.selected{background:var(--color-accent);color:var(--color-paper)}.quality small{display:flex;justify-content:space-between;color:var(--color-faint);font-size:var(--text-xs)}.tip{margin:var(--space-5) 0;padding:var(--space-3);display:flex;gap:var(--space-2);border:var(--rule-thin) solid var(--color-accent-glow);border-radius:var(--radius-sm);background:var(--color-accent-soft);color:var(--color-accent);font-size:var(--text-xs);line-height:1.5}.tip p{margin:0}.tip b{display:block}.download{width:100%;min-height:48px;border:0;border-radius:var(--radius-sm);background:var(--color-accent);color:var(--color-paper);font-weight:700;cursor:pointer;box-shadow:0 8px 24px var(--color-accent-glow);transition:transform var(--dur-fast) var(--ease-out),filter var(--dur-fast) var(--ease-out)}.download:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.06)}button:disabled{opacity:.42;cursor:not-allowed}.single{width:100%;padding:var(--space-3);border:0;background:transparent;color:var(--color-accent);font-size:var(--text-xs);font-weight:700;cursor:pointer}.message{position:fixed;left:50%;bottom:var(--space-6);z-index:30;padding:var(--space-3) var(--space-5);border:var(--rule-thin) solid var(--color-accent);border-radius:var(--radius-round);background:var(--color-paper-raised);color:var(--color-ink);box-shadow:0 10px 36px oklch(5% 0 0/.5);font-size:var(--text-sm);opacity:0;transform:translate(-50%,80px);pointer-events:none;transition:opacity var(--dur-base) var(--ease-out),transform var(--dur-base) var(--ease-out)}.message.show{opacity:1;transform:translate(-50%,0)}footer{padding:var(--space-6);border-top:var(--rule-thin) solid var(--color-rule);text-align:center;color:var(--color-faint);font-size:var(--text-xs)}@media(max-width:1000px){.workspace{grid-template-columns:220px minmax(0,1fr)}.export{grid-column:1/-1;border-left:0;border-top:var(--rule-thin) solid var(--color-rule)}}@media(max-width:720px){.topbar{padding:var(--space-3) var(--space-4)}.brand>span:last-child{display:none}.intro{padding-top:var(--space-8)}.intro p{font-size:var(--text-base)}.workspace{width:calc(100% - 20px);display:flex;flex-direction:column}.uploads{border-right:0;border-bottom:var(--rule-thin) solid var(--color-rule)}.dropzone{min-height:180px}.thumbs{max-height:190px}.local{display:none}.editor-head{padding:var(--space-4)}.editor-head>span{display:none}.canvas-stage{min-height:auto;padding:var(--space-6) var(--space-4)}.canvas-box,.empty-canvas{width:min(100%,420px)}.controls{padding:var(--space-4)}.export{border-left:0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;transition-duration:50ms!important;animation-duration:50ms!important}}
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="bear"></i></span><span>大熊寶殿 GTARP 工具庫</span></a>
    <a class="back" href="./index.html"><i data-lucide="arrow-left"></i> 返回工具庫</a>
  </nav>
  <header class="intro">
    <h1>圖片方格<span>製作工具</span></h1>
    <p>逐張調整正方形構圖，精準輸出 100×100，再以高品質格式優化檔案大小。</p>
    <span class="privacy"><i data-lucide="shield-check"></i> 圖片只在你的裝置上處理，不會上傳</span>
  </header>

  <main class="workspace">
    <aside class="panel uploads">
      <h2 class="panel-title">待處理圖片 <span class="count" id="count">0 張</span><label class="upload-button" id="addButton" hidden aria-label="加入圖片">＋<input id="moreFiles" type="file" multiple accept="image/*"></label></h2>
      <label class="dropzone" id="dropzone">
        <span class="drop-icon"><i data-lucide="image-up"></i></span>
        <strong>拖曳圖片到這裡</strong><span>或點一下選擇檔案</span><small>支援 JPG、PNG、WebP · 可多選</small>
        <input id="files" type="file" multiple accept="image/*">
      </label>
      <div class="thumbs" id="thumbs" hidden></div>
      <p class="local">關閉頁面後，圖片與設定會自動清除。</p>
    </aside>

    <section class="editor">
      <div class="editor-head"><h2>調整正方形構圖</h2><span>畫布比例 1:1 · 1000 × 1000</span></div>
      <div class="canvas-stage">
        <div class="empty-canvas" id="empty"><i data-lucide="move"></i><strong>先加入圖片</strong><p>上傳後即可拖曳調整位置</p></div>
        <div class="canvas-box" id="canvasBox" hidden><canvas id="canvas" aria-label="可拖曳調整圖片位置的裁切畫布"></canvas></div>
      </div>
      <div class="controls">
        <div class="zoom"><label for="zoom">縮放 <b id="zoomValue">100%</b></label><input id="zoom" type="range" min="1" max="4" step=".01" value="1" disabled></div>
        <button class="reset" id="reset" disabled><i data-lucide="rotate-ccw"></i> 重設構圖</button>
      </div>
    </section>

    <aside class="panel export">
      <h2>輸出設定</h2>
      <div class="size-card"><small>輸出尺寸</small><strong>100 <span>×</span> 100</strong><span>像素 · 等比例縮放</span></div>
      <fieldset><legend>檔案格式</legend><div class="format">
        <button class="selected" data-format="image/webp">WebP</button>
        <button data-format="image/jpeg">JPG</button>
        <button data-format="image/png">PNG</button>
      </div></fieldset>
      <div class="quality"><label for="quality">壓縮品質 <b id="qualityValue">90%</b></label><input id="quality" type="range" min="65" max="100" value="90"><small><span>檔案較小</span><span>畫質最佳</span></small></div>
      <div class="tip"><i data-lucide="sparkles"></i><p><b>智慧建議</b>WebP 90% 通常能兼顧清晰度與最小檔案。</p></div>
      <button class="download" id="downloadAll" disabled><i data-lucide="download"></i> 下載全部圖片</button>
      <button class="single" id="downloadOne" hidden>只下載目前這張</button>
    </aside>
  </main>
  <div class="message" id="message" role="status"></div>
  <footer>Copyright ©大熊寶殿 · Made for GTARP Community.</footer>

  <script>
    lucide.createIcons();
    const PREVIEW=1000,OUTPUT=100;
    let pictures=[],activeId=null,format="image/webp",quality=90,pointer=null,messageTimer=null;
    const $=id=>document.getElementById(id);
    const canvas=$("canvas"),context=canvas.getContext("2d");
    const active=()=>pictures.find(p=>p.id===activeId);
    function notify(text){clearTimeout(messageTimer);$("message").textContent=text;$("message").classList.add("show");messageTimer=setTimeout(()=>$("message").classList.remove("show"),2800)}
    function draw(target,picture,size){const ctx=target.getContext("2d");target.width=size;target.height=size;ctx.fillStyle="#fff";ctx.fillRect(0,0,size,size);ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality="high";const cover=Math.max(PREVIEW/picture.image.naturalWidth,PREVIEW/picture.image.naturalHeight);const scale=cover*picture.zoom*size/PREVIEW,width=picture.image.naturalWidth*scale,height=picture.image.naturalHeight*scale;ctx.drawImage(picture.image,(picture.x+PREVIEW/2)*size/PREVIEW-width/2,(picture.y+PREVIEW/2)*size/PREVIEW-height/2,width,height)}
    function render(){const picture=active();$("count").textContent=pictures.length+" 張";$("dropzone").hidden=pictures.length>0;$("thumbs").hidden=!pictures.length;$("addButton").hidden=!pictures.length;$("empty").hidden=!!picture;$("canvasBox").hidden=!picture;$("zoom").disabled=!picture;$("reset").disabled=!picture;$("downloadAll").disabled=!pictures.length;$("downloadOne").hidden=!picture;if(picture){$("zoom").value=picture.zoom;$("zoomValue").textContent=Math.round(picture.zoom*100)+"%";draw(canvas,picture,PREVIEW)}$("thumbs").innerHTML=pictures.map((picture,index)=>`<button class="thumb ${picture.id===activeId?"active":""}" data-id="${picture.id}"><img src="${picture.url}" alt=""><span class="thumb-copy"><b>${String(index+1).padStart(2,"0")}</b><small>${escapeHtml(picture.name)}</small></span><i class="remove" data-remove="${picture.id}" aria-label="移除">×</i></button>`).join("")}
    function escapeHtml(text){const div=document.createElement("div");div.textContent=text;return div.innerHTML}
    async function addFiles(fileList){const files=[...fileList].filter(file=>file.type.startsWith("image/"));if(!files.length)return notify("請選擇圖片檔案");const loaded=await Promise.all(files.map(file=>new Promise((resolve,reject)=>{const url=URL.createObjectURL(file),image=new Image();image.onload=()=>resolve({id:crypto.randomUUID(),name:file.name,url,image,zoom:1,x:0,y:0});image.onerror=reject;image.src=url})));pictures.push(...loaded);activeId=activeId||loaded[0].id;render();notify(`已加入 ${loaded.length} 張圖片`)}
    ["files","moreFiles"].forEach(id=>$(id).addEventListener("change",event=>{if(event.target.files)addFiles(event.target.files);event.target.value=""}));
    $("dropzone").addEventListener("dragover",event=>{event.preventDefault();$("dropzone").classList.add("over")});$("dropzone").addEventListener("dragleave",()=>$("dropzone").classList.remove("over"));$("dropzone").addEventListener("drop",event=>{event.preventDefault();$("dropzone").classList.remove("over");addFiles(event.dataTransfer.files)});
    $("thumbs").addEventListener("click",event=>{const remove=event.target.closest("[data-remove]");if(remove){const id=remove.dataset.remove,target=pictures.find(p=>p.id===id);if(target)URL.revokeObjectURL(target.url);pictures=pictures.filter(p=>p.id!==id);if(activeId===id)activeId=pictures[0]?.id||null;return render()}const thumb=event.target.closest("[data-id]");if(thumb){activeId=thumb.dataset.id;render()}});
    $("zoom").addEventListener("input",event=>{const picture=active();if(picture){picture.zoom=+event.target.value;render()}});$("reset").addEventListener("click",()=>{const picture=active();if(picture){picture.zoom=1;picture.x=0;picture.y=0;render()}});
    canvas.addEventListener("pointerdown",event=>{const picture=active();if(!picture)return;canvas.setPointerCapture(event.pointerId);pointer={id:event.pointerId,cx:event.clientX,cy:event.clientY,x:picture.x,y:picture.y}});canvas.addEventListener("pointermove",event=>{const picture=active();if(!pointer||!picture||pointer.id!==event.pointerId)return;const ratio=PREVIEW/canvas.getBoundingClientRect().width;picture.x=pointer.x+(event.clientX-pointer.cx)*ratio;picture.y=pointer.y+(event.clientY-pointer.cy)*ratio;draw(canvas,picture,PREVIEW)});["pointerup","pointercancel"].forEach(name=>canvas.addEventListener(name,()=>pointer=null));
    document.querySelectorAll("[data-format]").forEach(button=>button.addEventListener("click",()=>{format=button.dataset.format;document.querySelectorAll("[data-format]").forEach(item=>item.classList.toggle("selected",item===button));$("quality").disabled=format==="image/png"}));$("quality").addEventListener("input",event=>{quality=+event.target.value;$("qualityValue").textContent=quality+"%"});
    async function save(picture,index){const output=document.createElement("canvas");draw(output,picture,OUTPUT);const blob=await new Promise(resolve=>output.toBlob(resolve,format,format==="image/png"?undefined:quality/100));if(!blob)return;const link=document.createElement("a"),base=picture.name.replace(/\.[^/.]+$/,"").replace(/[<>:\"/\\\\|?*]/g,"-"),ext=format==="image/jpeg"?"jpg":format.split("/")[1];link.href=URL.createObjectURL(blob);link.download=`${base}-100x100-${index+1}.${ext}`;link.click();setTimeout(()=>URL.revokeObjectURL(link.href),1000)}
    $("downloadOne").addEventListener("click",()=>{const picture=active();if(picture)save(picture,pictures.indexOf(picture))});$("downloadAll").addEventListener("click",async()=>{notify("正在產生高品質圖片…");for(let i=0;i<pictures.length;i++){await save(pictures[i],i);await new Promise(resolve=>setTimeout(resolve,180))}notify(`完成！已輸出 ${pictures.length} 張圖片`)});
  </script>
</body>
</html>
