<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="今日匯率換算工具，可同時顯示多個幣種並即時換算。">
  <title>今日匯率換算 - 大熊寶殿</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./tokens.css">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--color-paper);color:var(--color-ink);font-family:var(--font-body)}body{background-image:radial-gradient(circle at 50% 0%,var(--color-accent-soft),transparent 42%)}button,input{font:inherit;color:inherit}.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);min-height:68px;padding:var(--space-3) clamp(var(--space-4),4vw,var(--space-10));border-bottom:var(--rule-thin) solid var(--color-rule);background:oklch(16% .012 300/.9);backdrop-filter:blur(14px)}.brand,.back{display:inline-flex;align-items:center;gap:var(--space-2);text-decoration:none;font-weight:700;white-space:nowrap}.brand{color:var(--color-ink)}.brand-mark{display:grid;place-items:center;width:38px;height:38px;border:var(--rule-thin) solid var(--color-accent);border-radius:var(--radius-round);color:var(--color-accent);background:var(--color-accent-soft)}.back{padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);color:var(--color-muted);font-size:var(--text-sm)}.back:hover{color:var(--color-accent);border-color:var(--color-accent)}.page{width:min(1380px,calc(100% - 32px));margin:auto;padding:var(--space-10) 0 var(--space-12)}.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--space-6);margin-bottom:var(--space-6)}.intro h1{margin:0 0 var(--space-2);font-size:var(--text-display);line-height:1.15}.intro h1 span{color:var(--color-accent);text-shadow:0 0 20px var(--color-accent-glow)}.intro p{margin:0;color:var(--color-muted);font-size:var(--text-base)}.sync{display:flex;align-items:center;justify-content:flex-end;gap:var(--space-3);flex-wrap:wrap;color:var(--color-muted);font-size:var(--text-xs)}.source a{color:var(--color-accent)}.status{display:inline-flex;align-items:center;gap:var(--space-2)}.status-dot{width:8px;height:8px;border-radius:50%;background:var(--color-faint)}.status[data-state="success"] .status-dot{background:var(--color-success)}.status[data-state="error"] .status-dot{background:var(--color-error)}.refresh{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper-raised);font-size:var(--text-xs);font-weight:700;cursor:pointer}.refresh:hover:not(:disabled){color:var(--color-accent);border-color:var(--color-accent)}.refresh.loading svg{animation:spin .9s linear infinite}.workbench{border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-lg);background:var(--color-paper-raised);box-shadow:0 22px 70px oklch(5% 0 0/.42);overflow:hidden}.section{padding:var(--space-6)}.section+.section{border-top:var(--rule-thin) solid var(--color-rule)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5)}.section-head h2{margin:0;font-size:var(--text-xl)}.section-head p{margin:0;color:var(--color-muted);font-size:var(--text-xs)}.primary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}.currency-slot{min-width:0;padding:var(--space-5);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-md);background:var(--color-paper);transition:border-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}.currency-slot:hover{border-color:var(--color-accent)}.currency-slot.active{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent),0 0 24px var(--color-accent-glow)}.currency-slot.drop-target{transform:translateY(-3px);border-style:dashed;background:var(--color-accent-soft)}.slot-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-5)}.code{display:block;color:var(--color-accent);font-size:var(--text-xl);font-weight:700;letter-spacing:.04em}.name{display:block;margin-top:2px;color:var(--color-muted);font-size:var(--text-sm)}.source-label{color:var(--color-accent);font-size:var(--text-xs);font-weight:700}.amount{width:100%;min-width:0;padding:var(--space-3) 0;border:0;border-bottom:2px solid var(--color-rule);outline:0;background:transparent;color:var(--color-ink);font-size:clamp(1.5rem,3vw,2.35rem);font-variant-numeric:tabular-nums}.amount:focus{border-color:var(--color-accent)}.amount:disabled{opacity:.45}.available-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-3)}.currency-option{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper);text-align:left;cursor:grab}.currency-option:hover{border-color:var(--color-accent);background:var(--color-paper-soft)}.currency-option:active{cursor:grabbing}.currency-option.selected{border-color:var(--color-accent);background:var(--color-accent-soft)}.currency-option.dragging{opacity:.45}.grip{color:var(--color-faint)}.option-copy{min-width:0}.option-copy b,.option-copy small{display:block}.option-copy small{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--color-muted)}.option-value{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}.notice{margin-top:var(--space-5);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);border:var(--rule-thin) dashed var(--color-rule);border-radius:var(--radius-sm);color:var(--color-muted);font-size:var(--text-sm)}.notice.pick{border-color:var(--color-accent);color:var(--color-accent);background:var(--color-accent-soft)}.error{display:none;margin-top:var(--space-4);padding:var(--space-3);border:var(--rule-thin) solid var(--color-error);border-radius:var(--radius-sm);color:var(--color-error);font-size:var(--text-sm)}.error.show{display:flex;align-items:center;gap:var(--space-2)}.footnote{padding:var(--space-4) var(--space-6);border-top:var(--rule-thin) solid var(--color-rule);color:var(--color-faint);font-size:var(--text-xs);text-align:center}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.primary-grid,.available-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page-head{align-items:flex-start;flex-direction:column}.sync{justify-content:flex-start}}@media(max-width:600px){.brand>span:last-child{display:none}.page{width:calc(100% - 20px);padding-top:var(--space-8)}.section{padding:var(--space-4)}.section-head{align-items:flex-start;flex-direction:column}.primary-grid,.available-grid{grid-template-columns:1fr}.currency-slot{padding:var(--space-4)}.amount{font-size:1.75rem}.currency-option{min-height:64px}.sync{width:100%;justify-content:space-between}.sync .source{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:50ms!important;animation-duration:50ms!important}}
  </style>
</head>
<body>
  <nav class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="bear"></i></span><span>大熊寶殿 GTARP 工具庫</span></a>
    <a class="back" href="./index.html"><i data-lucide="arrow-left"></i> 返回工具庫</a>
  </nav>
  <main class="page">
    <div class="page-head">
      <div class="intro"><h1>今日<span>匯率換算</span></h1><p>輸入任一主要幣種金額，即時換算全部幣值。</p></div>
      <div class="sync">
        <span class="status" id="status" data-state="loading"><span class="status-dot"></span><span id="statusText">正在取得匯率…</span></span>
        <span id="updatedAt">更新時間：—</span>
        <button class="refresh loading" id="refresh" type="button" disabled><i data-lucide="refresh-cw"></i>重新整理</button>
        <span class="source">資料來源：<a href="https://frankfurter.dev/" target="_blank" rel="noopener noreferrer">Frankfurter</a></span>
      </div>
    </div>
    <div class="workbench">
      <section class="section" aria-labelledby="primaryTitle">
        <div class="section-head"><h2 id="primaryTitle">主要幣種</h2><p>可在任一格輸入金額</p></div>
        <div class="primary-grid" id="primaryGrid" aria-live="polite"></div>
      </section>
      <section class="section" aria-labelledby="availableTitle">
        <div class="section-head"><h2 id="availableTitle">可選幣種</h2><p>拖曳幣種至上方任一格即可替換；觸控裝置可依序點選。</p></div>
        <div class="available-grid" id="availableGrid"></div>
        <div class="notice" id="notice"><i data-lucide="grip"></i><span>拖曳下方幣種到上方四格，或點選幣種後再點目標格。</span></div>
        <div class="error" id="error" role="alert"><i data-lucide="circle-alert"></i><span id="errorText"></span></div>
      </section>
      <p class="footnote">匯率為每日參考資料，不代表銀行或交易平台的實際成交價格。</p>
    </div>
  </main>
  <script>
    const API="https://api.frankfurter.dev/v2/rates";
    const CURRENCIES={TWD:{name:"新臺幣",symbol:"NT$"},HKD:{name:"港幣",symbol:"HK$"},USD:{name:"美元",symbol:"US$"},EUR:{name:"歐元",symbol:"€"},JPY:{name:"日圓",symbol:"¥"},CNY:{name:"人民幣",symbol:"CN¥"},KRW:{name:"韓元",symbol:"₩"},GBP:{name:"英鎊",symbol:"£"},AUD:{name:"澳幣",symbol:"A$"},CAD:{name:"加幣",symbol:"C$"},SGD:{name:"新加坡幣",symbol:"S$"},THB:{name:"泰銖",symbol:"฿"},CHF:{name:"瑞士法郎",symbol:"CHF"},NZD:{name:"紐西蘭幣",symbol:"NZ$"},PHP:{name:"菲律賓披索",symbol:"₱"},MYR:{name:"馬來西亞令吉",symbol:"RM"}};
    const ALL=Object.keys(CURRENCIES),CACHE_KEY="j5x-exchange-rates-v1";
    let primary=["TWD","HKD","USD","EUR"],rates={TWD:1},amount=100,source="TWD",picked=null,dragged=null,rateDate="";
    const $=id=>document.getElementById(id);
    const format=(value,code)=>new Intl.NumberFormat("zh-TW",{maximumFractionDigits:["JPY","KRW"].includes(code)?0:4}).format(value);
    const converted=code=>amount*(rates[code]||0)/(rates[source]||1);
    function render(){
      $("primaryGrid").innerHTML=primary.map(code=>`<article class="currency-slot ${code===source?"active":""}" data-slot="${code}" tabindex="0" aria-label="${CURRENCIES[code].name}，可輸入或接受拖放"><div class="slot-top"><span><b class="code">${code}</b><small class="name">${CURRENCIES[code].name}</small></span><span class="source-label">${code===source?"換算來源":""}</span></div><input class="amount" data-input="${code}" type="text" inputmode="decimal" value="${rates[code]?format(converted(code),code):"—"}" aria-label="${CURRENCIES[code].name}金額" ${rates[code]?"":"disabled"}></article>`).join("");
      const available=ALL.filter(code=>!primary.includes(code));
      $("availableGrid").innerHTML=available.map(code=>`<button class="currency-option ${picked===code?"selected":""}" type="button" draggable="true" data-currency="${code}" aria-pressed="${picked===code}"><i class="grip" data-lucide="grip-vertical"></i><span class="option-copy"><b>${code}</b><small>${CURRENCIES[code].name}</small></span><span class="option-value">${rates[code]?format(converted(code),code):"—"}</span></button>`).join("");
      $("notice").classList.toggle("pick",!!picked);$("notice").querySelector("span").textContent=picked?`已選擇 ${picked}，請點選上方要替換的幣種。`:"拖曳下方幣種到上方四格，或點選幣種後再點目標格。";
      lucide.createIcons();bindInteractions();
    }
    function setSource(code,value){const numeric=Number(String(value).replace(/,/g,""));if(!Number.isFinite(numeric)||numeric<0)return;source=code;amount=numeric;document.querySelectorAll(".currency-slot").forEach(slot=>{const active=slot.dataset.slot===code;slot.classList.toggle("active",active);slot.querySelector(".source-label").textContent=active?"換算來源":""});document.querySelectorAll("[data-input]").forEach(input=>{if(input.dataset.input!==code)input.value=rates[input.dataset.input]?format(converted(input.dataset.input),input.dataset.input):"—"});document.querySelectorAll(".option-value").forEach(valueNode=>{const code=valueNode.closest("[data-currency]").dataset.currency;valueNode.textContent=rates[code]?format(converted(code),code):"—"})}
    function replaceCurrency(target,next){const index=primary.indexOf(target);if(index<0||primary.includes(next))return;const nextAmount=source===target?converted(next):amount;primary[index]=next;if(source===target){source=next;amount=nextAmount}picked=null;render()}
    function bindInteractions(){
      document.querySelectorAll("[data-input]").forEach(input=>input.addEventListener("input",event=>setSource(event.target.dataset.input,event.target.value)));
      document.querySelectorAll("[data-currency]").forEach(option=>{option.addEventListener("click",()=>{picked=picked===option.dataset.currency?null:option.dataset.currency;render()});option.addEventListener("dragstart",event=>{dragged=option.dataset.currency;option.classList.add("dragging");event.dataTransfer.effectAllowed="move"});option.addEventListener("dragend",()=>{dragged=null;document.querySelectorAll(".drop-target").forEach(item=>item.classList.remove("drop-target"))})});
      document.querySelectorAll("[data-slot]").forEach(slot=>{const activate=()=>{if(picked)replaceCurrency(slot.dataset.slot,picked)};slot.addEventListener("click",event=>{if(!event.target.closest("input"))activate()});slot.addEventListener("keydown",event=>{if((event.key==="Enter"||event.key===" ")&&picked){event.preventDefault();activate()}});slot.addEventListener("dragover",event=>{event.preventDefault();slot.classList.add("drop-target")});slot.addEventListener("dragleave",()=>slot.classList.remove("drop-target"));slot.addEventListener("drop",event=>{event.preventDefault();slot.classList.remove("drop-target");if(dragged)replaceCurrency(slot.dataset.slot,dragged)})});
    }
    function setStatus(state,text){$("status").dataset.state=state;$("statusText").textContent=text;$("refresh").disabled=state==="loading";$("refresh").classList.toggle("loading",state==="loading")}
    function applyRows(rows,cached=false){rates={TWD:1};rows.forEach(row=>rates[row.quote]=row.rate);rateDate=rows.reduce((latest,row)=>row.date>latest?row.date:latest,"");$("updatedAt").textContent=`匯率日期：${rateDate||"—"}`;setStatus(cached?"error":"success",cached?"使用上次資料":"資料已更新");render()}
    async function loadRates(){setStatus("loading","正在取得匯率…");$("error").classList.remove("show");try{const quotes=ALL.filter(code=>code!=="TWD").join(","),response=await fetch(`${API}?base=TWD&quotes=${quotes}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(!Array.isArray(rows)||!rows.length)throw new Error("空白資料");localStorage.setItem(CACHE_KEY,JSON.stringify({rows,savedAt:Date.now()}));applyRows(rows)}catch(error){const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(cached?.rows?.length){applyRows(cached.rows,true);$("errorText").textContent="目前無法更新，暫時顯示上次成功取得的匯率。"}else{setStatus("error","資料載入失敗");$("errorText").textContent="目前無法取得匯率，請檢查網路後重新整理。"}$("error").classList.add("show");console.error(error)}finally{$("refresh").disabled=false;$("refresh").classList.remove("loading");lucide.createIcons()}}
    $("refresh").addEventListener("click",loadRates);render();loadRates();
  </script>
</body>
</html>
