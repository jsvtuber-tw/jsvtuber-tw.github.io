  <style>

nt)}.status[data-state="success"] .status-dot{background:var(--color-success)}.status[data-state="error"] .status-dot{background:var(--color-error)}.refresh{display:inline-flex;align-items:center;gap:var(--space-2);padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper-raised);font-size:var(--text-xs);font-weight:700;cursor:pointer}.refresh:hover:not(:disabled){color:var(--color-accent);border-color:var(--color-accent)}.refresh.loading svg{animation:spin .9s linear infinite}.workbench{border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-lg);background:var(--color-paper-raised);box-shadow:0 22px 70px oklch(5% 0 0/.42);overflow:hidden}.section{padding:var(--space-6)}.section+.section{border-top:var(--rule-thin) solid var(--color-rule)}.section-head{display:flex;align-items:center;justify-content:space-between;gap:var(--space-4);margin-bottom:var(--space-5)}.section-head h2{margin:0;font-size:var(--text-xl)}.section-head p{margin:0;color:var(--color-muted);font-size:var(--text-xs)}.primary-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--space-4)}.currency-slot{min-width:0;padding:var(--space-5);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-md);background:var(--color-paper);transition:border-color var(--dur-fast) var(--ease-out),background var(--dur-fast) var(--ease-out),transform var(--dur-fast) var(--ease-out)}.currency-slot:hover{border-color:var(--color-accent)}.currency-slot.active{border-color:var(--color-accent);box-shadow:0 0 0 1px var(--color-accent),0 0 24px var(--color-accent-glow)}.currency-slot.drop-target{transform:translateY(-3px);border-style:dashed;background:var(--color-accent-soft)}.slot-top{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3);margin-bottom:var(--space-5)}.slot-actions{display:flex;align-items:center;gap:var(--space-2)}.pin{display:grid;p r(--space-5);padding:var(--space-3) var(--space-4);display:flex;align-items:center;gap:var(--space-3);border:var(--rule-thin) dashed var(--color-rule);border-radius:var(--radius-sm);color:var(--color-muted);font-size:var(--text-sm)}.notice.pick{border-color:var(--color-accent);color:var(--color-accent);background:var(--color-accent-soft)}.error{display:none;margin-top:var(--space-4);padding:var(--space-3);border:var(--rule-thin) solid var(--color-error);border-radius:var(--radius-sm);color:var(--color-error);font-size:var(--text-sm)}.error.show{display:flex;align-items:center;gap:var(--space-2)}.footnote{padding:var(--space-4) var(--space-6);border-top:var(--rule-thin) solid var(--color-rule);color:var(--color-faint);font-size:var(--text-xs);text-align:center}button:focus-visible,a:focus-visible,input:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--color-focus);outline-offset:3px}button:disabled{opacity:.45;cursor:not-allowed}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:1000px){.primary-grid,.available-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.page-head{align-items:flex-start;flex-direction:column}.sync{justify-content:flex-start}}@media(max-width:600px){.brand>span:last-child{display:none}.page{width:calc(100% - 20px);padding-top:var(--space-8)}.section{padding:var(--space-4)}.section-head{align-items:flex-start;flex-direction:column}.primary-grid,.available-grid{grid-template-columns:1fr}.currency-slot{padding:var(--space-4)}.amount{font-size:1.75rem}.currency-option{min-height:64px}.sync{width:100%;justify-content:space-between}.sync .source{width:100%}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:50ms!important;animation-duration:50ms!important}}
  </style>
  <style>
    .history{margin-bottom:var(--space-6);padding:var(--space-6);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-lg);background:var(--color-paper-raised);box-shadow:0 18px 48px oklch(5% 0 0/.3)}.history-head{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-5);margin-bottom:var(--space-4)}.history-title h2{margin:0;font-size:var(--text-xl)}.history-title p{margin:var(--space-2) 0 0;color:var(--color-muted);font-size:var(--text-sm)}.history-title strong{color:var(--color-ink);font-size:var(--text-lg);font-variant-numeric:tabular-nums}.ranges{display:flex;gap:var(--space-1);padding:var(--space-1);border-radius:var(--radius-sm);background:var(--color-paper)}.range{min-width:58px;padding:var(--space-2);border:0;border-radius:6px;background:transparent;color:var(--color-muted);font-size:var(--text-xs);font-weight:700;cursor:pointer}.range:hover,.range.selected{background:var(--color-accent-soft);color:var(--color-accent)}.chart-wrap{position:relative;min-height:320px;border-top:var(--rule-thin) solid var(--color-rule)}#historyChart{display:block;width:100%;height:320px;touch-action:pan-y}.chart-state{position:absolute;inset:0;display:grid;place-items:center;color:var(--color-muted);font-size:var(--text-sm);pointer-events:none}.chart-state[hidden]{display:none}.chart-tooltip{position:absolute;z-index:2;min-width:150px;padding:var(--space-2) var(--space-3);border:var(--rule-thin) solid var(--color-rule);border-radius:var(--radius-sm);background:var(--color-paper);box-shadow:0 10px 28px oklch(5% 0 0/.45);font-size:var(--text-xs);font-variant-numeric:tabular-nums;pointer-events:none}.chart-tooltip b,.chart-tooltip span{display:block}.chart-tooltip span{margin-top:2px;color:var(--color-muted)}.chart-tooltip[hidden]{display:none}.currency-option{grid-template-columns:minmax(0,1fr) auto;gap:var(--space-2);padding:var(--space-2)}.option-select{min-width:0;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:var(--space-3);padding:var(--space-1);border:0;background:transparent;text-align:left;cursor:pointer}@media(max-width:760px){.history{padding:var(--space-4)}.history-head{flex-direction:column}.ranges{width:100%;overflow-x:auto}.range{flex:1 0 58px}.chart-wrap,#historyChart{height:260px;min-height:260px}}

<body>
  <nav class="topbar">
    <a class="brand" href="./index.html"><span class="brand-mark"><i data-lucide="paw-print"></i></span><span>大熊寶殿 GTARP 工具庫</span></a>
    <a class="back" href="./index.html"><i data-lucide="arrow-left"></i> 返回工具庫</a>
  </nav>
  <main class="page">
    <div class="page-head">
      <div class="intro"><h1>今日<span>匯率換算</span></h1><p>輸入任一主要幣種金額，即時換算全部幣值。</p></div>
      <div class="sync">
        <span class="status" id="status" data-state="loading"><span class="status-dot"></span><span id="statusText">正在取得匯率…</span></span>
        <span id="updatedAt">更新時間：—</span>
        <button class="refresh loading" id="refresh" type="button" disabled><i data-lucide="refresh-cw"></i>重新整理</button>
        <span class="source">資料來源：<a href="https://frankfurter.dev/" target="_blank" rel="noopener noreferrer">Frankfurter</a></span>
      </div>
    </div>
    <section class="history" aria-labelledby="historyTitle">
      <div class="history-head">
        <div class="history-title"><h2 id="historyTitle">TWD／USD 歷史匯率</h2><p><strong id="historyLatest">—</strong> <span id="historyDates">正在取得歷史資料…</span></p></div>
        <div class="ranges" role="group" aria-label="歷史匯率時間範圍">
          <button class="range" data-range="7d">1 週</button><button class="range selected" data-range="1m">1 個月</button><button class="range" data-range="1y">1 年</button><button class="range" data-range="5y">5 年</button><button class="range" data-range="max">最久</button>
        </div>
      </div>
      <div class="chart-wrap"><canvas id="historyChart" role="img" aria-label="新臺幣相對美元的一個月歷史匯率折線圖"></canvas><div class="chart-state" id="chartState">正在載入歷史匯率…</div><div class="chart-tooltip" id="chartTooltip" hidden></div></div>
    </section>
    <div class="workbench">
      <section class="section" aria-labelledby="primaryTitle">
        <div class="section-head"><h2 id="primaryTitle">主要幣種</h2><p>按圖釘設定歷史匯率基準；可在任一格輸入金額</p></div>
        <div class="primary-grid" id="primaryGrid" aria-live="polite"></div>
      </section>
      <section class="section" aria-labelledby="availableTitle">
        <div class="section-head"><h2 id="availableTitle">可選幣種</h2><p>點選可查看相對於固定幣種的歷史匯率；按圖釘可改變基準。</p></div>
        <div class="available-grid" id="availableGrid"></div>
        <div class="notice" id="notice"><i data-lucide="grip"></i><span>拖曳下方幣種到上方四格，或點選幣種後再點目標格。</span></div>
        <div class="error" id="error" role="alert"><i data-lucide="circle-alert"></i><span id="errorText"></span></div>
      </section>
      <p class="footnote">匯率為每日參考資料，不代表銀行或交易平台的實際成交價格。</p>
    </div>
  </main>
  <script>
    const API="https://api.frankfurter.dev/v2/rates";
    const CURRENCIES={TWD:{name:"新臺幣",symbol:"NT$"},HKD:{name:"港幣",symbol:"HK$"},USD:{name:"美元",symbol:"US$"},EUR:{name:"歐元",symbol:"€"},JPY:{name:"日圓",symbol:"¥"},CNY:{name:"人民幣",symbol:"CN¥"},KRW:{name:"韓元",symbol:"₩"},GBP:{name:"英鎊",symbol:"£"},AUD:{name:"澳幣",symbol:"A$"},CAD:{name:"加幣",symbol:"C$"},SGD:{name:"新加坡幣",symbol:"S$"},THB:{name:"泰銖",symbol:"฿"},CHF:{name:"瑞士法郎",symbol:"CHF"},NZD:{name:"紐西蘭幣",symbol:"NZ$"},PHP:{name:"菲律賓披索",symbol:"₱"},MYR:{name:"馬來西亞令吉",symbol:"RM"}};
    const ALL=Object.keys(CURRENCIES),CACHE_KEY="j5x-exchange-rates-v1";
    const HISTORY_RANGES={"7d":{label:"1 週",days:7},"1m":{label:"1 個月",months:1},"1y":{label:"1 年",years:1,group:"week"},"5y":{label:"5 年",years:5,group:"month"},max:{label:"最久",from:"1981-01-02",group:"month"}};
    let primary=["TWD","HKD","USD","EUR"],rates={TWD:1},amount=100,source="TWD",picked=null,dragged=null,rateDate="",chartBase="TWD",chartQuote="USD",chartRange="1m",chartRows=[],chartRequest=0,hoverIndex=-1;
    const $=id=>document.getElementById(id);
    const format=(value,code)=>new Intl.NumberFormat("zh-TW",{maximumFractionDigits:["JPY","KRW"].includes(code)?0:4}).format(value);
    const converted=code=>amount*(rates[code]||0)/(rates[source]||1);
    function render(){
      $("primaryGrid").innerHTML=primary.map(code=>`<article class="currency-slot ${code===source?"active":""}" data-slot="${code}" tabindex="0" aria-label="${CURRENCIES[code].name}，可輸入或接受拖放"><div class="slot-top"><span><b class="code">${code}</b><small class="name">${CURRENCIES[code].name}</small></span><span class="slot-actions"><span class="source-label">${code===source?"換算來源":""}</span><button class="pin ${code===chartBase?"pinned":""}" data-pin="${code}" type="button" aria-pressed="${code===chartBase}" aria-label="將 ${CURRENCIES[code].name} 設為歷史匯率基準" title="設為歷史匯率基準"><i data-lucide="pin"></i></button></span></div><input class="amount" data-input="${code}" type="text" inputmode="decimal" value="${rates[code]?format(converted(code),code):"—"}" aria-label="${CURRENCIES[code].name}金額" ${rates[code]?"":"disabled"}></article>`).join("");
      const available=ALL.filter(code=>!primary.includes(code));
      $("availableGrid").innerHTML=available.map(code=>`<article class="currency-option ${picked===code?"selected":""}" draggable="true" data-currency="${code}"><button class="option-select" data-select-currency="${code}" type="button" aria-pressed="${picked===code}" aria-label="查看 ${CURRENCIES[code].name} 歷史匯率並選取此幣種"><i class="grip" data-lucide="grip-vertical"></i><span class="option-copy"><b>${code}</b><small>${CURRENCIES[code].name}</small></span><span class="option-value">${rates[code]?format(converted(code),code):"—"}</span></button><button class="pin ${code===chartBase?"pinned":""}" data-pin="${code}" type="button" aria-pressed="${code===chartBase}" aria-label="將 ${CURRENCIES[code].name} 設為歷史匯率基準" title="設為歷史匯率基準"><i data-lucide="pin"></i></button></article>`).join("");
      $("notice").classList.toggle("pick",!!picked);$("notice").querySelector("span").textContent=picked?`已選擇 ${picked}，請點選上方要替換的幣種。`:"拖曳下方幣種到上方四格，或點選幣種後再點目標格。";
      lucide.createIcons();bindInteractions();
    }
    function fallbackQuote(base){return ALL.find(code=>code!==base&&primary.includes(code))||ALL.find(code=>code!==base)}
    function setHistoryBase(code){if(chartBase===code)return;const previous=chartBase;chartBase=code;if(chartQuote===code)chartQuote=previous===code?fallbackQuote(code):previous;render();loadHistory()}
    function selectHistory(code){if(code===chartBase)return;if(chartQuote===code)return;chartQuote=code;loadHistory()}
    function setSource(code,value){const numeric=Number(String(value).replace(/,/g,""));if(!Number.isFinite(numeric)||numeric<0)return;source=code;amount=numeric;selectHistory(code);document.querySelectorAll(".currency-slot").forEach(slot=>{const active=slot.dataset.slot===code;slot.classList.toggle("active",active);slot.querySelector(".source-label").textContent=active?"換算來源":""});document.querySelectorAll("[data-input]").forEach(input=>{if(input.dataset.input!==code)input.value=rates[input.dataset.input]?format(converted(input.dataset.input),input.dataset.input):"—"});document.querySelectorAll(".option-value").forEach(valueNode=>{const code=valueNode.closest("[data-currency]").dataset.currency;valueNode.textContent=rates[code]?format(converted(code),code):"—"})}
    function replaceCurrency(target,next){const index=primary.indexOf(target);if(index<0||primary.includes(next))return;const nextAmount=source===target?converted(next):amount;primary[index]=next;if(source===target){source=next;amount=nextAmount}picked=null;selectHistory(next);render()}
    function bindInteractions(){
      document.querySelectorAll("[data-input]").forEach(input=>{input.addEventListener("focus",()=>selectHistory(input.dataset.input));input.addEventListener("input",event=>setSource(event.target.dataset.input,event.target.value))});
      document.querySelectorAll("[data-pin]").forEach(button=>button.addEventListener("click",event=>{event.stopPropagation();setHistoryBase(button.dataset.pin)}));
      document.querySelectorAll("[data-select-currency]").forEach(button=>button.addEventListener("click",()=>{const code=button.dataset.selectCurrency;selectHistory(code);picked=picked===code?null:code;render()}));
      document.querySelectorAll("[data-currency]").forEach(option=>{option.addEventListener("dragstart",event=>{dragged=option.dataset.currency;selectHistory(dragged);option.classList.add("dragging");event.dataTransfer.effectAllowed="move"});option.addEventListener("dragend",()=>{dragged=null;document.querySelectorAll(".drop-target").forEach(item=>item.classList.remove("drop-target"))})});
      document.querySelectorAll("[data-slot]").forEach(slot=>{const activate=()=>{if(picked)replaceCurrency(slot.dataset.slot,picked);else selectHistory(slot.dataset.slot)};slot.addEventListener("click",event=>{if(!event.target.closest("input"))activate()});slot.addEventListener("keydown",event=>{if(event.key==="Enter"||event.key===" "){event.preventDefault();activate()}});slot.addEventListener("dragover",event=>{event.preventDefault();slot.classList.add("drop-target")});slot.addEventListener("dragleave",()=>slot.classList.remove("drop-target"));slot.addEventListener("drop",event=>{event.preventDefault();slot.classList.remove("drop-target");if(dragged)replaceCurrency(slot.dataset.slot,dragged)})});
    }
    function isoDate(date){return date.toISOString().slice(0,10)}
    function historyQuery(){const config=HISTORY_RANGES[chartRange],to=new Date(),from=new Date(to);if(config.days)from.setDate(from.getDate()-config.days);if(config.months)from.setMonth(from.getMonth()-config.months);if(config.years)from.setFullYear(from.getFullYear()-config.years);const start=config.from||isoDate(from),params=new URLSearchParams({base:chartBase,quotes:chartQuote,from:start,to:isoDate(to)});if(config.group)params.set("group",config.group);return params}
    function drawChart(){const canvas=$("historyChart"),ctx=canvas.getContext("2d"),rect=canvas.getBoundingClientRect(),dpr=Math.min(devicePixelRatio||1,2),width=Math.max(320,rect.width),height=rect.height||320;canvas.width=width*dpr;canvas.height=height*dpr;ctx.scale(dpr,dpr);ctx.clearRect(0,0,width,height);if(chartRows.length<2)return;const pad={left:54,right:18,top:22,bottom:34},plotW=width-pad.left-pad.right,plotH=height-pad.top-pad.bottom,values=chartRows.map(row=>row.rate),rawMin=Math.min(...values),rawMax=Math.max(...values),spread=Math.max(rawMax-rawMin,rawMax*.01),min=rawMin-spread*.15,max=rawMax+spread*.15,x=index=>pad.left+index/(chartRows.length-1)*plotW,y=value=>pad.top+(max-value)/(max-min)*plotH,styles=getComputedStyle(document.documentElement),rule=styles.getPropertyValue("--color-rule"),muted=styles.getPropertyValue("--color-muted"),accent=styles.getPropertyValue("--color-accent");ctx.font='12px "Noto Sans TC"';ctx.textBaseline="middle";for(let i=0;i<4;i++){const value=max-(max-min)*i/3,py=pad.top+plotH*i/3;ctx.strokeStyle=rule;ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pad.left,py);ctx.lineTo(width-pad.right,py);ctx.stroke();ctx.fillStyle=muted;ctx.textAlign="right";ctx.fillText(value.toFixed(value<10?4:2),pad.left-9,py)}const gradient=ctx.createLinearGradient(0,pad.top,0,height-pad.bottom);gradient.addColorStop(0,"rgba(255,158,247,.28)");gradient.addColorStop(1,"rgba(255,158,247,0)");ctx.beginPath();chartRows.forEach((row,index)=>index?ctx.lineTo(x(index),y(row.rate)):ctx.moveTo(x(index),y(row.rate)));ctx.lineTo(x(chartRows.length-1),height-pad.bottom);ctx.lineTo(x(0),height-pad.bottom);ctx.closePath();ctx.fillStyle=gradient;ctx.fill();ctx.beginPath();chartRows.forEach((row,index)=>index?ctx.lineTo(x(index),y(row.rate)):ctx.moveTo(x(index),y(row.rate)));ctx.strokeStyle=accent;ctx.lineWidth=2.5;ctx.lineJoin="round";ctx.stroke();ctx.fillStyle=muted;ctx.textAlign="left";ctx.fillText(chartRows[0].date,pad.left,height-14);ctx.textAlign="right";ctx.fillText(chartRows.at(-1).date,width-pad.right,height-14);if(hoverIndex>=0&&chartRows[hoverIndex]){const px=x(hoverIndex),py=y(chartRows[hoverIndex].rate);ctx.setLineDash([3,3]);ctx.strokeStyle=muted;ctx.beginPath();ctx.moveTo(px,pad.top);ctx.lineTo(px,height-pad.bottom);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle=accent;ctx.beginPath();ctx.arc(px,py,5,0,Math.PI*2);ctx.fill()}}
    async function loadHistory(){const request=++chartRequest,config=HISTORY_RANGES[chartRange];$("historyTitle").textContent=`${chartBase}／${chartQuote} 歷史匯率`;$("historyLatest").textContent="—";$("historyDates").textContent="正在取得歷史資料…";$("chartState").hidden=false;$("chartState").textContent="正在載入歷史匯率…";$("historyChart").setAttribute("aria-label",`${chartBase} 相對 ${chartQuote} 的${config.label}歷史匯率折線圖`);try{const response=await fetch(`${API}?${historyQuery()}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(request!==chartRequest)return;if(!Array.isArray(rows)||rows.length<2)throw new Error("歷史資料不足");chartRows=rows.filter(row=>Number.isFinite(row.rate)).sort((a,b)=>a.date.localeCompare(b.date));const latest=chartRows.at(-1);$("historyLatest").textContent=`1 ${chartBase} = ${format(latest.rate,chartQuote)} ${chartQuote}`;$("historyDates").textContent=`${chartRows[0].date}－${latest.date}`;$("chartState").hidden=true;hoverIndex=-1;drawChart()}catch(error){if(request!==chartRequest)return;chartRows=[];$("chartState").hidden=false;$("chartState").textContent="無法取得歷史匯率，請稍後重試。";$("historyDates").textContent="歷史資料載入失敗";drawChart();console.error(error)}}
    function setStatus(state,text){$("status").dataset.state=state;$("statusText").textContent=text;$("refresh").disabled=state==="loading";$("refresh").classList.toggle("loading",state==="loading")}
    function applyRows(rows,cached=false){rates={TWD:1};rows.forEach(row=>rates[row.quote]=row.rate);rateDate=rows.reduce((latest,row)=>row.date>latest?row.date:latest,"");$("updatedAt").textContent=`匯率日期：${rateDate||"—"}`;setStatus(cached?"error":"success",cached?"使用上次資料":"資料已更新");render()}
    async function loadRates(){setStatus("loading","正在取得匯率…");$("error").classList.remove("show");try{const quotes=ALL.filter(code=>code!=="TWD").join(","),response=await fetch(`${API}?base=TWD&quotes=${quotes}`);if(!response.ok)throw new Error(`HTTP ${response.status}`);const rows=await response.json();if(!Array.isArray(rows)||!rows.length)throw new Error("空白資料");localStorage.setItem(CACHE_KEY,JSON.stringify({rows,savedAt:Date.now()}));applyRows(rows)}catch(error){const cached=JSON.parse(localStorage.getItem(CACHE_KEY)||"null");if(cached?.rows?.length){applyRows(cached.rows,true);$("errorText").textContent="目前無法更新，暫時顯示上次成功取得的匯率。"}else{setStatus("error","資料載入失敗");$("errorText").textContent="目前無法取得匯率，請檢查網路後重新整理。"}$("error").classList.add("show");console.error(error)}finally{$("refresh").disabled=false;$("refresh").classList.remove("loading");lucide.createIcons()}}
    document.querySelectorAll("[data-range]").forEach(button=>button.addEventListener("click",()=>{chartRange=button.dataset.range;document.querySelectorAll("[data-range]").forEach(item=>item.classList.toggle("selected",item===button));loadHistory()}));
    $("historyChart").addEventListener("pointermove",event=>{if(!chartRows.length)return;const rect=event.currentTarget.getBoundingClientRect(),plotLeft=54,plotRight=18,index=Math.max(0,Math.min(chartRows.length-1,Math.round((event.clientX-rect.left-plotLeft)/(rect.width-plotLeft-plotRight)*(chartRows.length-1))));hoverIndex=index;const row=chartRows[index],tooltip=$("chartTooltip");tooltip.innerHTML=`<b>1 ${chartBase} = ${format(row.rate,chartQuote)} ${chartQuote}</b><span>${row.date}</span>`;tooltip.hidden=false;tooltip.style.left=`${Math.min(rect.width-170,Math.max(8,event.clientX-rect.left+12))}px`;tooltip.style.top=`${Math.max(8,event.clientY-rect.top-58)}px`;drawChart()});$("historyChart").addEventListener("pointerleave",()=>{hoverIndex=-1;$("chartTooltip").hidden=true;drawChart()});new ResizeObserver(drawChart).observe($("historyChart"));
    $("refresh").addEventListener("click",()=>{loadRates();loadHistory()});render();loadRates();loadHistory();
  </script>
